name: Test table tennis 2

on:
  pull_request:
    paths:
      - "table-tennis2/**"
      - ".github/workflows/test-table-tennis2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: table-tennis2
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: table-tennis2/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run checks
        run: npm run check
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: table-tennis2-playwright-report
          path: table-tennis2/playwright-report
          retention-days: 7
