name: Deploy table tennis to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "table-tennis/**"
      - "table-tennis2/**"
      - ".github/scripts/*-pages-site.mjs"
      - ".github/workflows/deploy-table-tennis-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            table-tennis/package-lock.json
            table-tennis2/package-lock.json
      - name: Install table-tennis dependencies
        working-directory: table-tennis
        run: npm ci
      - name: Install Playwright browsers
        working-directory: table-tennis
        run: npx playwright install --with-deps chromium webkit
      - name: Check table-tennis
        working-directory: table-tennis
        run: npm run check
      - name: Install table-tennis2 dependencies
        working-directory: table-tennis2
        run: npm ci
      - name: Check table-tennis2
        working-directory: table-tennis2
        run: npm run check
      - name: Compose Pages site
        run: node .github/scripts/build-pages-site.mjs
      - name: Check Pages site
        run: node .github/scripts/check-pages-site.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
