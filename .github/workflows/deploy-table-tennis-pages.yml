name: Deploy table tennis to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "table-tennis/**"
      - ".github/workflows/deploy-table-tennis-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: table-tennis
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
